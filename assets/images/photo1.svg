<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC" />
      <stop offset="50%" stop-color="#FFC2D1" />
      <stop offset="100%" stop-color="#FFB3C6" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF8FAB" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad1)" />
  <circle cx="300" cy="300" r="240" fill="url(#sunGlow)" />
  
  <!-- Flower bouquet & silhouette -->
  <g transform="translate(300, 420)">
    <!-- Tulips & Roses -->
    <path d="M-60,0 C-100,-80 0,-140 0,-180 C0,-140 100,-80 60,0 Z" fill="#FB6F92" opacity="0.85" />
    <path d="M-40,20 C-70,-50 0,-100 0,-130 C0,-100 70,-50 40,20 Z" fill="#FF8FAB" />
    <circle cx="0" cy="-60" r="45" fill="#FFE5EC" opacity="0.9" />
    <text x="0" y="-52" font-family="'Playfair Display', serif" font-size="28" fill="#FB6F92" text-anchor="middle" font-weight="bold">Ana 🌷</text>
    <text x="0" y="-15" font-family="'Great Vibes', cursive" font-size="36" fill="#C81D4A" text-anchor="middle">Beautiful Smile</text>
  </g>

  <!-- Sparkles & Stars -->
  <text x="120" y="180" font-size="32" fill="#FFF">✨</text>
  <text x="480" y="220" font-size="28" fill="#FFF">🌸</text>
  <text x="150" y="650" font-size="30" fill="#FFF">💖</text>
  <text x="450" y="620" font-size="34" fill="#FFF">✨</text>
  
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8,6" rx="16" opacity="0.6" />
</svg>
